<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eurovision Countdown</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">

<style>

:root{
    --ev-pink:#ff1e8e;
    --ev-purple:#c02eff;
    --ev-violet:#7b5cff;
    --ev-blue:#00b4e5;
}

html, body {
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:'Montserrat', Arial, sans-serif;
    background:#000;
}

body {
    background:
    radial-gradient(
        ellipse at 50% 38%,
        #1c0b3a 0%,
        #0d0524 42%,
        #040112 72%,
        #000000 100%
    );

    display:flex;
    align-items:center;
    justify-content:center;
}


/* ============================================
   STATIC STAGE BACKGROUND (no heavy filters)
   ============================================ */

.bg {
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.beams {
    position:absolute;
    inset:-25%;
    background:
    repeating-conic-gradient(
        from 0deg at 50% 42%,
        rgba(255,30,142,.075) 0deg 7deg,
        transparent 7deg 20deg,
        rgba(0,180,229,.060) 20deg 27deg,
        transparent 27deg 42deg,
        rgba(123,92,255,.070) 42deg 49deg,
        transparent 49deg 68deg
    );
}

.glow {
    position:absolute;
    border-radius:50%;
}

.glow-pink {
    width:70vmax;
    height:70vmax;
    left:-22vmax;
    top:-16vmax;
    background:
    radial-gradient(circle, rgba(255,30,142,.30) 0%, rgba(255,30,142,.10) 34%, transparent 66%);
}

.glow-blue {
    width:66vmax;
    height:66vmax;
    right:-20vmax;
    bottom:-20vmax;
    background:
    radial-gradient(circle, rgba(0,180,229,.26) 0%, rgba(0,180,229,.08) 36%, transparent 68%);
}

.glow-violet {
    width:50vmax;
    height:50vmax;
    left:50%;
    top:52%;
    margin-left:-25vmax;
    margin-top:-25vmax;
    background:
    radial-gradient(circle, rgba(123,92,255,.16) 0%, transparent 62%);
}

.stars {
    position:absolute;
    inset:0;
    opacity:.55;
    background-image:
    radial-gradient(1.5px 1.5px at 8% 22%, rgba(255,255,255,.75), transparent),
    radial-gradient(1px 1px at 16% 64%, rgba(180,240,255,.70), transparent),
    radial-gradient(1.6px 1.6px at 24% 14%, rgba(255,255,255,.60), transparent),
    radial-gradient(1px 1px at 33% 82%, rgba(255,180,230,.65), transparent),
    radial-gradient(1.8px 1.8px at 42% 28%, rgba(255,255,255,.70), transparent),
    radial-gradient(1px 1px at 51% 72%, rgba(180,240,255,.60), transparent),
    radial-gradient(1.5px 1.5px at 59% 12%, rgba(255,255,255,.65), transparent),
    radial-gradient(1px 1px at 67% 56%, rgba(255,180,230,.60), transparent),
    radial-gradient(1.6px 1.6px at 75% 34%, rgba(255,255,255,.70), transparent),
    radial-gradient(1px 1px at 83% 76%, rgba(180,240,255,.60), transparent),
    radial-gradient(1.6px 1.6px at 91% 18%, rgba(255,255,255,.65), transparent),
    radial-gradient(1px 1px at 96% 48%, rgba(255,255,255,.55), transparent),
    radial-gradient(1.2px 1.2px at 12% 42%, rgba(180,240,255,.60), transparent),
    radial-gradient(1px 1px at 21% 88%, rgba(255,255,255,.55), transparent),
    radial-gradient(1.4px 1.4px at 38% 52%, rgba(255,180,230,.55), transparent),
    radial-gradient(1px 1px at 55% 40%, rgba(255,255,255,.50), transparent),
    radial-gradient(1.4px 1.4px at 71% 86%, rgba(180,240,255,.55), transparent),
    radial-gradient(1px 1px at 87% 6%, rgba(255,255,255,.50), transparent),
    radial-gradient(1.3px 1.3px at 4% 74%, rgba(255,255,255,.55), transparent),
    radial-gradient(1px 1px at 46% 6%, rgba(255,180,230,.50), transparent);
}

.stage-floor {
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:40vh;
    background:
    linear-gradient(
        to top,
        rgba(255,30,142,.10) 0%,
        rgba(123,92,255,.05) 45%,
        transparent 100%
    );
}


/* ============================================
   MAIN STAGE
   ============================================ */

#stage {
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:20px;
}

.ev-heart {
    width:clamp(76px, 16vw, 120px);
    height:auto;
    margin-bottom:18px;
    filter:
    drop-shadow(0 6px 26px rgba(255,30,142,.35))
    drop-shadow(0 0 50px rgba(0,180,229,.18));
}

#countdown {

    font-size:clamp(56px, 12.5vw, 124px);

    font-weight:900;

    line-height:1;

    letter-spacing:2px;

    font-variant-numeric:tabular-nums;

    user-select:none;

    transition:opacity .7s ease;

    background:
    linear-gradient(
        100deg,
        var(--ev-pink) 0%,
        var(--ev-purple) 30%,
        var(--ev-violet) 55%,
        var(--ev-blue) 100%
    );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    filter:
    drop-shadow(0 6px 18px rgba(0,0,0,.60))
    drop-shadow(0 0 26px rgba(192,46,255,.22));
}

.ev-tag {

    margin-top:18px;

    font-size:clamp(9px, 1.9vw, 13px);

    font-weight:800;

    letter-spacing:.5em;

    padding-left:.5em;

    text-transform:uppercase;

    color:rgba(255,255,255,.70);
}


/* ============================================
   YEAR MENU
   ============================================ */

#yearMenu {

    position:fixed;

    top:35px;

    left:50%;

    width:290px;

    padding:24px;

    box-sizing:border-box;

    border-radius:26px;

    border:2px solid transparent;

    background:
    linear-gradient(
        160deg,
        rgba(28,12,56,.97),
        rgba(9,3,24,.98)
    ) padding-box,

    linear-gradient(
        135deg,
        var(--ev-pink),
        var(--ev-purple),
        var(--ev-blue)
    ) border-box;

    box-shadow:
    0 24px 70px rgba(0,0,0,.75),
    0 0 40px rgba(192,46,255,.20);

    opacity:0;

    transform:
    translate(-50%, -420px)
    scale(.92);

    transition:
    transform .5s cubic-bezier(.16,1.2,.3,1),
    opacity .35s ease;

    will-change:transform, opacity;

    z-index:10;
}

#yearMenu.show {

    opacity:1;

    transform:
    translate(-50%, 0)
    scale(1);
}

/* graceful fade-out when a year is confirmed */
#yearMenu.closing {

    opacity:0;

    transform:
    translate(-50%, -12px)
    scale(.94);

    transition:
    opacity .3s ease,
    transform .36s cubic-bezier(.4, 0, .6, 1);

    pointer-events:none;
}

#yearInput {

    width:100%;

    box-sizing:border-box;

    padding:16px 0;

    font-family:inherit;

    font-size:34px;

    font-weight:900;

    letter-spacing:6px;

    text-align:center;

    color:#fff;

    caret-color:var(--ev-blue);

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.20);

    border-radius:16px;

    outline:none;

    transition:
    border-color .25s ease,
    background .25s ease,
    box-shadow .25s ease;
}

#yearInput:focus {

    border-color:var(--ev-blue);

    background:rgba(255,255,255,.11);

    box-shadow:0 0 0 3px rgba(0,180,229,.16);
}

#yearInput::placeholder {

    color:#fff;

    opacity:.42;

    letter-spacing:6px;
}

#yearText {

    color:#fff;

    text-align:center;

    margin-top:16px;

    font-size:13px;

    font-weight:600;

    letter-spacing:1px;

    opacity:.85;

    line-height:22px;
}

#yearText span {

    font-weight:900;

    letter-spacing:1.5px;

    background:
    linear-gradient(
        90deg,
        var(--ev-pink),
        var(--ev-purple),
        var(--ev-blue)
    );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;
}


/* ============================================
   OVERLAY / SHAKE
   ============================================ */

#overlay {

    position:fixed;

    inset:0;

    background:#000;

    opacity:0;

    pointer-events:none;

    transition:opacity 1s ease;

    z-index:5;
}

.shake {
    animation:shake .45s ease;
}

@keyframes shake {

    0% {
        transform:
        translate(-50%, 0)
        scale(1);
    }

    20% {
        transform:
        translate(calc(-50% - 14px), 0)
        scale(1.03);
    }

    40% {
        transform:
        translate(calc(-50% + 14px), 0)
        scale(1.03);
    }

    60% {
        transform:
        translate(calc(-50% - 8px), 0)
        scale(1.01);
    }

    80% {
        transform:
        translate(calc(-50% + 4px), 0)
        scale(1);
    }

    100% {
        transform:
        translate(-50%, 0)
        scale(1);
    }
}

</style>
</head>


<body>


<div class="bg" aria-hidden="true">

    <div class="beams"></div>

    <div class="glow glow-pink"></div>
    <div class="glow glow-blue"></div>
    <div class="glow glow-violet"></div>

    <div class="stage-floor"></div>

    <div class="stars"></div>

</div>



<div id="yearMenu">

<input
id="yearInput"
maxlength="4"
placeholder="YEAR"
autocomplete="off"
spellcheck="false">

<div id="yearText">

Choose year<br>

<span>
2024 • 2025 • 2026
</span>

</div>

</div>



<main id="stage">

    <svg class="ev-heart" viewBox="0 0 120 110" aria-hidden="true">

        <defs>

            <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"   stop-color="#ff1e8e"/>
                <stop offset="35%"  stop-color="#c02eff"/>
                <stop offset="65%"  stop-color="#7b5cff"/>
                <stop offset="100%" stop-color="#00b4e5"/>
            </linearGradient>

            <linearGradient id="heartSheen" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%"   stop-color="#ffffff" stop-opacity=".55"/>
                <stop offset="45%"  stop-color="#ffffff" stop-opacity=".06"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>

        </defs>

        <path
        d="M60 104 C36 86 8 64 8 40 C8 22 22 8 40 8 C50 8 57 14 60 21 C63 14 70 8 80 8 C98 8 112 22 112 40 C112 64 84 86 60 104 Z"
        fill="url(#heartGrad)"/>

        <path
        d="M60 104 C36 86 8 64 8 40 C8 22 22 8 40 8 C50 8 57 14 60 21 C63 14 70 8 80 8 C98 8 112 22 112 40 C112 64 84 86 60 104 Z"
        fill="url(#heartSheen)"
        opacity=".35"/>

    </svg>


    <div id="countdown">
    44.00
    </div>


    <div class="ev-tag">
    United by Music
    </div>

</main>



<div id="overlay"></div>




<script>


const years = {

    2026:44000,

    2025:46000,

    2024:47000

};



let TOTAL = 44000;

let state = "idle";

let startTime = 0;

let raf = null;

let menuOpen = false;

let menuClosing = false;

let lastText = "";



const countdownEl =
document.getElementById("countdown");

const overlay =
document.getElementById("overlay");

const yearMenu =
document.getElementById("yearMenu");

const yearInput =
document.getElementById("yearInput");




function format(ms){

    const sec = Math.floor(ms / 1000);

    const cs = Math.floor((ms % 1000) / 10);

    return String(sec).padStart(2, "0") + "." + String(cs).padStart(2, "0");
}




function loop(now){

    const remaining = Math.max(0, TOTAL - (now - startTime));

    const text = format(remaining);

    if (text !== lastText){

        countdownEl.textContent = text;

        lastText = text;
    }

    if (remaining <= 0){

        finish();

        return;
    }

    raf = requestAnimationFrame(loop);
}




function finish(){

    if (raf) cancelAnimationFrame(raf);

    raf = null;

    state = "finished";

    if (menuOpen) closeMenu();

    overlay.style.opacity = 1;

    countdownEl.style.opacity = 0;
}




function start(){

    if (raf) cancelAnimationFrame(raf);

    state = "running";

    startTime = performance.now();

    lastText = "";

    overlay.style.opacity = 0;

    countdownEl.style.opacity = 1;

    raf = requestAnimationFrame(loop);
}




function reset(){

    if (raf) cancelAnimationFrame(raf);

    raf = null;

    state = "idle";

    overlay.style.opacity = 0;

    countdownEl.style.opacity = 1;

    lastText = "";

    countdownEl.textContent = format(TOTAL);
}




function openMenu(){

    if (menuOpen) return;

    menuOpen = true;

    menuClosing = false;

    yearMenu.classList.remove("closing");

    yearMenu.classList.add("show");

    yearInput.value = "";

    setTimeout(() => {

        if (menuOpen) yearInput.focus();

    }, 320);
}




/* fades the menu out, then runs the callback once it is fully hidden */

function closeMenu(done){

    if (!menuOpen || menuClosing) return;

    menuClosing = true;

    yearInput.blur();

    yearMenu.classList.remove("shake");

    yearMenu.classList.add("closing");

    setTimeout(() => {

        yearMenu.classList.remove("show", "closing");

        menuOpen = false;

        menuClosing = false;

        if (typeof done === "function") done();

    }, 340);
}




function invalid(){

    yearMenu.classList.add("shake");

    setTimeout(() => {

        yearMenu.classList.remove("shake");

        closeMenu();

    }, 500);
}




function chooseYear(year){

    TOTAL = years[year];

    reset();

    closeMenu(() => start());
}




yearInput.addEventListener(
"keydown",
e => {

    if (e.key === "Escape"){

        e.preventDefault();

        closeMenu();

        return;
    }

    if (e.key === "Enter"){

        e.preventDefault();

        const year = yearInput.value.trim();

        if (years[year]){

            chooseYear(year);

        }

        else {

            invalid();

        }
    }
});




window.addEventListener(
"keydown",
e => {

    if (e.key === "Escape" && menuOpen){

        closeMenu();

        return;
    }

    if (e.key === "Enter" && !menuOpen){

        openMenu();

        return;
    }

    if (e.key.toLowerCase() === "q"){

        finish();

        return;
    }

    if (!menuOpen){

        if (state === "idle"){

            start();

        }

        else if (state === "finished"){

            reset();

            start();

        }
    }
});


</script>


</body>
</html>
